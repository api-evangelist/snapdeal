name: SnapDeal
description: >-
  Snapdeal is an Indian e-commerce marketplace founded in February 2010 by Kunal
  Bahl and Rohit Bansal and headquartered in Gurugram/New Delhi. It began as a
  daily-deals platform and grew into a value-focused online marketplace that
  connects third-party sellers with buyers across categories such as fashion,
  home and kitchen, electronics accessories, and general merchandise, primarily
  serving price-sensitive shoppers in India's smaller cities and towns. Sellers
  onboard and manage catalog, orders, and payouts through the Snapdeal seller
  portal (seller.snapdeal.com). Snapdeal has been backed by investors including
  SoftBank, Bessemer Venture Partners, Nexus Venture Partners, and Kalaari
  Capital. This profile was surfaced as a portfolio company of Bessemer Venture
  Partners; enrichment found no public developer portal, no api.snapdeal.com or
  developer.snapdeal.com host, and no published API specification or well-known
  discovery surface — the seller portal is login-gated behind SSO.
